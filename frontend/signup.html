<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — BillWise AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="dashboard-body">
  <nav class="navbar">
    <div class="nav-brand">
      <i class="fa-solid fa-receipt nav-logo-icon"></i>
      <span class="nav-logo-text">BillWise<span class="accent">AI</span></span>
    </div>
    <div class="nav-links">
      <a href="index.html" class="nav-link">Home</a>
      <a href="upload.html" class="nav-link">Upload Bill</a>
      <a href="dashboard.html" class="nav-link">Dashboard</a>
      <a href="history.html" class="nav-link">History</a>
      <a href="login.html" class="nav-link">Login</a>
    </div>
  </nav>

  <main class="main-content">
    <section class="hero" style="padding-top: 48px; padding-bottom: 48px;">
      <div class="hero-content" style="max-width: 700px; margin: 0 auto; text-align: center;">
        <div class="hero-badge">
          <i class="fa-solid fa-user-plus"></i> Create account
        </div>
        <h1 class="hero-headline">Sign up for BillWise AI</h1>
        <p class="hero-sub">Create a new account to start scanning bills and viewing your dashboard.</p>
      </div>

      <div class="card" style="max-width: 520px; margin: 32px auto 0; padding: 32px;">
        <h2 class="card-title">New here?</h2>

        <form id="signupForm" class="auth-form">
          <div class="form-group">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" class="input-field" placeholder="Choose a username" required />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" class="input-field" placeholder="Create a password" required />
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input id="confirmPassword" name="confirmPassword" type="password" class="input-field" placeholder="Confirm your password" required />
          </div>

          <div id="signupMessage" class="form-note" style="margin-bottom: 16px; color: var(--text-muted);"></div>

          <button type="submit" class="btn-primary btn-full">
            <i class="fa-solid fa-user-plus"></i>
            Create account
          </button>
        </form>

        <p style="margin-top:24px; text-align:center; color:var(--text-secondary);">
          Already have an account?
          <a href="login.html" style="color:var(--color-primary); font-weight:600;">Login here</a>
        </p>
      </div>
    </section>
  </main>

  <script>
    const API_URL = 'http://127.0.0.1:5000';
    const signupForm = document.getElementById('signupForm');
    const signupMessage = document.getElementById('signupMessage');

    signupForm?.addEventListener('submit', async (event) => {
      event.preventDefault();

      const username = document.getElementById('username')?.value.trim();
      const password = document.getElementById('password')?.value.trim();
      const confirmPassword = document.getElementById('confirmPassword')?.value.trim();

      if (!username || !password || !confirmPassword) {
        signupMessage.textContent = 'Please fill all fields.';
        return;
      }

      if (password !== confirmPassword) {
        signupMessage.style.color = 'var(--red)';
        signupMessage.textContent = 'Passwords do not match.';
        return;
      }

      try {
       const response = await fetch(`${API_URL}/api/signup`, {
    method: 'POST',
    credentials: 'include',
    headers: {
        'Content-Type': 'application/json',
    },
    body: JSON.stringify({
        username,
        password,
        confirm_password: confirmPassword
    })
});

        const data = await response.json();

        if (!response.ok) {
          signupMessage.style.color = 'var(--red)';
          signupMessage.textContent = data.error || 'Signup failed.';
          return;
        }

        signupMessage.style.color = 'var(--text-secondary)';
        signupMessage.textContent = 'Signup successful. Redirecting...';
        window.location.href = 'dashboard.html';
      } catch (error) {
        signupMessage.style.color = 'var(--red)';
        signupMessage.textContent = error.message || 'Unable to sign up.';
      }
    });
  </script>
</body>
</html>
