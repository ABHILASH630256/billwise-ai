<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — BillWise AI Professional</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  <style>
    /* ============ LOGIN PAGE STYLES ============ */

    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      position: relative;
      padding: 20px;
    }

    .login-background {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      overflow: hidden;
    }

    .bg-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      animation: float 8s ease-in-out infinite;
    }

    .bg-blob-1 { width: 250px; height: 250px; background: rgba(147, 112, 219, 0.2); top: -50px; left: -50px; }
    .bg-blob-2 { width: 200px; height: 200px; background: rgba(6, 182, 212, 0.2); bottom: -50px; right: -50px; animation-delay: 3s; }

    .login-content {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 420px;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(167, 139, 250, 0.3);
      border-radius: 20px;
      padding: 40px;
      backdrop-filter: blur(10px);
      animation: slideUp 0.6s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .login-logo {
      font-size: 48px;
      margin-bottom: 15px;
      background: linear-gradient(135deg, #a78bfa, #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .login-title {
      font-size: 28px;
      font-weight: 800;
      color: #f3f4f6;
      margin-bottom: 10px;
    }

    .login-subtitle {
      color: #9ca3af;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #d1d5db;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-field {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(167, 139, 250, 0.3);
      border-radius: 10px;
      color: #f3f4f6;
      font-size: 15px;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    .input-field:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(167, 139, 250, 0.8);
      box-shadow: 0 0 20px rgba(167, 139, 250, 0.2);
    }

    .input-field::placeholder {
      color: #6b7280;
    }

    /* Password field wrapper */
    .password-wrapper {
      position: relative;
    }

    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #9ca3af;
      cursor: pointer;
      font-size: 18px;
      transition: color 0.3s ease;
      padding: 4px 8px;
    }

    .password-toggle:hover {
      color: #a78bfa;
    }

    /* Checkbox and Remember Me */
    .form-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .checkbox-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .checkbox-wrapper input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #a78bfa;
    }

    .checkbox-label {
      color: #d1d5db;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      user-select: none;
    }

    .forgot-password {
      color: #a78bfa;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: color 0.3s ease;
    }

    .forgot-password:hover {
      color: #c4b5fd;
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      background: linear-gradient(135deg, #a78bfa, #9333ea);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      position: relative;
      overflow: hidden;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(147, 112, 219, 0.4);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .btn-login.loading {
      opacity: 0.8;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top: 2px solid white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .login-message {
      margin-bottom: 20px;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      display: none;
    }

    .login-message.success {
      display: block;
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid rgba(16, 185, 129, 0.5);
      color: #86efac;
    }

    .login-message.error {
      display: block;
      background: rgba(248, 113, 113, 0.2);
      border: 1px solid rgba(248, 113, 113, 0.5);
      color: #fca5a5;
      animation: shake 0.5s;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      75% { transform: translateX(10px); }
    }

    .login-footer {
      margin-top: 25px;
      text-align: center;
      color: #9ca3af;
      font-size: 14px;
    }

    .login-footer a {
      color: #a78bfa;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s ease;
    }

    .login-footer a:hover {
      color: #c4b5fd;
    }

    /* Success Animation */
    .success-animation {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1000;
      animation: successPulse 0.8s ease-out;
    }

    @keyframes successPulse {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.5);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(1.5);
      }
    }

    .success-checkmark {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #a78bfa, #9333ea);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      color: white;
    }

    /* Validation indicators */
    .input-error {
      border-color: #f87171 !important;
    }

    .error-text {
      font-size: 12px;
      color: #f87171;
      margin-top: 4px;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .login-card {
        padding: 30px 20px;
      }

      .login-title {
        font-size: 24px;
      }

      .login-logo {
        font-size: 36px;
      }

      .form-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }
    }
  </style>
</head>
<body class="dashboard-body">
  <nav class="navbar">
    <div class="nav-brand">
      <i class="fa-solid fa-receipt nav-logo-icon"></i>
      <span class="nav-logo-text">BillWise<span class="accent">AI</span></span>
    </div>
    <div class="nav-links">
      <a href="index.html" class="nav-link">Home</a>
      <a href="login.html" class="nav-link active">Login</a>
      <a href="signup.html" class="nav-link">Sign Up</a>
    </div>
  </nav>

  <div class="login-container">
    <div class="login-background">
      <div class="bg-blob bg-blob-1"></div>
      <div class="bg-blob bg-blob-2"></div>
    </div>

    <div class="login-content">
      <div class="login-card">
        <div class="login-header">
          <div class="login-logo">
            <i class="fa-solid fa-receipt"></i>
          </div>
          <h1 class="login-title">Welcome Back</h1>
          <p class="login-subtitle">Sign in to manage your expenses</p>
        </div>

        <div id="loginMessage" class="login-message"></div>

        <form id="loginForm">
          <!-- Username -->
          <div class="form-group">
            <label for="username" class="form-label">Username</label>
            <input
              type="text"
              id="username"
              name="username"
              class="input-field"
              placeholder="Enter your username"
              required
            />
            <div class="error-text" id="usernameError"></div>
          </div>

          <!-- Password -->
          <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <div class="password-wrapper">
              <input
                type="password"
                id="password"
                name="password"
                class="input-field"
                placeholder="Enter your password"
                required
              />
              <button
                type="button"
                class="password-toggle"
                id="passwordToggle"
                onclick="togglePassword()"
              >
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
            <div class="error-text" id="passwordError"></div>
          </div>

          <!-- Remember Me & Forgot Password -->
          <div class="form-row">
            <label class="checkbox-wrapper">
              <input type="checkbox" id="rememberMe" name="rememberMe" />
              <span class="checkbox-label">Remember me</span>
            </label>
            <a href="#forgotPassword" class="forgot-password">
              Forgot Password?
            </a>
          </div>

          <!-- Login Button -->
          <button type="submit" class="btn-login" id="loginBtn">
            <i class="fa-solid fa-right-to-bracket"></i>
            <span>Sign In</span>
          </button>
        </form>

        <!-- Sign Up Link -->
        <div class="login-footer">
          Don't have an account?
          <a href="signup.html">Create one now</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'http://127.0.0.1:5000';

    // Password visibility toggle
    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const toggleBtn = document.getElementById('passwordToggle');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleBtn.innerHTML = '<i class="fa-solid fa-eye-slash"></i>';
      } else {
        passwordInput.type = 'password';
        toggleBtn.innerHTML = '<i class="fa-solid fa-eye"></i>';
      }
    }

    // Form validation
    function validateForm() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      let isValid = true;

      // Clear previous errors
      document.getElementById('usernameError').textContent = '';
      document.getElementById('passwordError').textContent = '';
      document.getElementById('username').classList.remove('input-error');
      document.getElementById('password').classList.remove('input-error');

      // Validate username
      if (!username) {
        document.getElementById('usernameError').textContent = 'Username is required';
        document.getElementById('username').classList.add('input-error');
        isValid = false;
      } else if (username.length < 3) {
        document.getElementById('usernameError').textContent = 'Username must be at least 3 characters';
        document.getElementById('username').classList.add('input-error');
        isValid = false;
      }

      // Validate password
      if (!password) {
        document.getElementById('passwordError').textContent = 'Password is required';
        document.getElementById('password').classList.add('input-error');
        isValid = false;
      } else if (password.length < 6) {
        document.getElementById('passwordError').textContent = 'Password must be at least 6 characters';
        document.getElementById('password').classList.add('input-error');
        isValid = false;
      }

      return isValid;
    }

    // Login handler
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      if (!validateForm()) return;

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const rememberMe = document.getElementById('rememberMe').checked;
      const loginBtn = document.getElementById('loginBtn');
      const loginMessage = document.getElementById('loginMessage');

      // Show loading state
      loginBtn.classList.add('loading');
      loginBtn.innerHTML = '<div class="spinner"></div><span>Signing in...</span>';

      try {
        const response = await fetch(`${API_URL}/api/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (!response.ok) {
          // Show error
          loginMessage.classList.add('error');
          loginMessage.classList.remove('success');
          loginMessage.textContent = data.error || 'Login failed. Please try again.';
          
          // Reset button
          loginBtn.classList.remove('loading');
          loginBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i><span>Sign In</span>';
          return;
        }

        // Save remember me preference
        if (rememberMe) {
          localStorage.setItem('rememberUsername', username);
        } else {
          localStorage.removeItem('rememberUsername');
        }

        // Show success message
        loginMessage.classList.add('success');
        loginMessage.classList.remove('error');
        loginMessage.innerHTML = '<i class="fa-solid fa-circle-check"></i> Login successful! Redirecting...';

        // Show success animation
        const animation = document.createElement('div');
        animation.className = 'success-animation';
        animation.innerHTML = '<div class="success-checkmark"><i class="fa-solid fa-check"></i></div>';
        document.body.appendChild(animation);

        // Redirect after animation
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1000);
      } catch (error) {
        loginMessage.classList.add('error');
        loginMessage.classList.remove('success');
        loginMessage.textContent = error.message || 'Unable to connect. Please try again.';
        
        loginBtn.classList.remove('loading');
        loginBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i><span>Sign In</span>';
      }
    });

    // Load remembered username
    window.addEventListener('load', () => {
      const remembered = localStorage.getItem('rememberUsername');
      if (remembered) {
        document.getElementById('username').value = remembered;
        document.getElementById('rememberMe').checked = true;
        document.getElementById('password').focus();
      }
    });
  </script>
</body>
</html>
